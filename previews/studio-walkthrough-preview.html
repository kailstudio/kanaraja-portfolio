<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Studio KAIL · Studio walkthrough (preview)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --cobalt: #335CFF;
    --lime:   #E0F87D;
    --lilac:  #D4C7FF;
    --dark:   #333333;
    --white:  #FFFFFF;
    --ink:    #1C1B22;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--ink); }
  body { font-family: 'Raleway', system-ui, sans-serif; color: var(--white); }

  .cw-scroll { position: relative; height: 2200vh; }
  .cw-stage {
    position: sticky; top: 0; height: 100vh; height: 100dvh; width: 100%; overflow: hidden;
    background:
      radial-gradient(45% 40% at 18% 12%, rgba(212,199,255,0.16) 0%, rgba(212,199,255,0) 70%),
      radial-gradient(50% 45% at 85% 90%, rgba(51,92,255,0.28) 0%, rgba(51,92,255,0) 70%),
      radial-gradient(35% 30% at 90% 15%, rgba(224,248,125,0.08) 0%, rgba(224,248,125,0) 70%),
      radial-gradient(70% 60% at 50% 40%, #3A3842 0%, #2A2930 45%, #1C1B22 100%);
  }
  canvas.cw-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  /* cinematic finish */
  .cw-vignette { position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(120% 90% at 50% 45%, rgba(0,0,0,0) 55%, rgba(0,0,0,0.55) 100%); }
  .cw-grain { position: absolute; inset: -50%; pointer-events: none; opacity: 0.05; background-size: 160px 160px; mix-blend-mode: overlay;
    animation: cw-grain 0.9s steps(6) infinite; }
  @keyframes cw-grain { 0%{transform:translate(0,0)} 20%{transform:translate(-3%,2%)} 40%{transform:translate(2%,-4%)} 60%{transform:translate(-4%,-1%)} 80%{transform:translate(3%,3%)} 100%{transform:translate(0,0)} }
  .cw-bar { position: absolute; left: 0; right: 0; height: 7vh; background: #121116; pointer-events: none; transform: scaleY(0); }
  .cw-bar--top { top: 0; transform-origin: top; }
  .cw-bar--bottom { bottom: 0; transform-origin: bottom; }

  /* opening: the main animation in its glass orb */
  .cw-intro { position: absolute; left: 50%; top: 50%; width: min(62vmin, 520px); aspect-ratio: 1;
    transform: translate(-50%, -50%); pointer-events: none; will-change: transform, opacity; }
  .cw-ring { position: absolute; border-radius: 50%; border: 1px solid rgba(212,199,255,0.45);
    box-shadow: 0 0 40px rgba(212,199,255,0.08) inset, 0 0 60px rgba(51,92,255,0.12); }
  .cw-ring--outer { inset: 0; } .cw-ring--inner { inset: 11%; border-color: rgba(212,199,255,0.3); }
  .cw-orb { position: absolute; inset: 21%; border-radius: 50%;
    background: radial-gradient(circle at 32% 26%, rgba(255,255,255,0.35) 0%, rgba(212,199,255,0.22) 30%, rgba(51,92,255,0.12) 70%, rgba(51,92,255,0.05) 100%);
    border: 1px solid rgba(212,199,255,0.55);
    box-shadow: inset 0 0 60px rgba(212,199,255,0.18), 0 30px 80px rgba(51,92,255,0.25); }
  .cw-intro-media { position: absolute; inset: 14%; display: grid; place-items: center; }
  .cw-intro-media video, .cw-intro-media img { width: 100%; height: 100%; object-fit: contain; }

  /* characters placed in the building */
  .cw-chip { position: absolute; left: 0; top: 0; width: 600px; height: 600px; transform-origin: 0 0;
    pointer-events: none; will-change: transform, opacity; opacity: 0; }
  .cw-chip video, .cw-chip img { width: 100%; height: 100%; object-fit: contain; display: block;
    filter: drop-shadow(0 30px 40px rgba(0,0,0,0.45)); }

  /* chapter caption */
  .cw-chapter { position: absolute; left: 6vw; bottom: 13vh; pointer-events: none; opacity: 0; }
  .cw-chapter-num { font-size: 12px; letter-spacing: 0.32em; color: var(--lime); text-transform: uppercase; }
  .cw-chapter-title { font-size: clamp(28px, 4vw, 54px); font-weight: 300; letter-spacing: 0.02em; margin-top: 8px; color: var(--white); }
  .cw-chapter-room { font-size: 12px; letter-spacing: 0.28em; text-transform: uppercase; color: var(--lilac); margin-top: 10px; opacity: 0.8; }
  .cw-chapter-line { width: 0; height: 1px; background: var(--lilac); margin-top: 16px; opacity: 0.6; }

  /* ending */
  .cw-end { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: min(34vmin, 300px); opacity: 0; pointer-events: none; text-align: center; }
  .cw-end svg { width: 100%; height: auto; display: block; }
  .cw-byline { display: flex; justify-content: space-between; margin-top: 12px;
    font-size: 13px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--lilac); }

  .cw-hint { position: absolute; left: 50%; bottom: 5vh; transform: translateX(-50%);
    font-size: 11px; letter-spacing: 0.3em; text-transform: uppercase; color: var(--lilac); opacity: 0.8; }
  .cw-progress { position: absolute; right: 24px; top: 50%; transform: translateY(-50%);
    width: 1px; height: 160px; background: rgba(212,199,255,0.18); }
  .cw-progress i { position: absolute; left: -0.5px; top: 0; width: 2px; background: var(--lime); }
  .cw-label { position: fixed; left: 18px; top: 16px; z-index: 50; font-size: 11px; letter-spacing: 0.16em;
    text-transform: uppercase; padding: 7px 12px; border-radius: 999px; color: var(--lilac);
    background: rgba(28,27,34,0.6); border: 1px solid rgba(212,199,255,0.3); backdrop-filter: blur(8px); }
  .cw-after { min-height: 60vh; display: grid; place-items: center; background: var(--ink);
    font-size: 13px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--lilac); opacity: 0.6; }
</style>
</head>
<body>
<div class="cw-label">Preview · Studio walkthrough</div>

<section class="cw-scroll" id="cwScroll">
  <div class="cw-stage">
    <canvas class="cw-canvas" id="cwCanvas"></canvas>

    <div class="cw-intro" id="cwIntro">
      <div class="cw-ring cw-ring--outer"></div>
      <div class="cw-ring cw-ring--inner"></div>
      <div class="cw-orb"></div>
      <div class="cw-intro-media" id="cwIntroMedia"></div>
    </div>

    <div id="cwChips"></div>

    <div class="cw-end" id="cwEnd">
      <svg viewBox="0 0 1590 460" aria-label="Studio KAIL">
        <g fill="#FFFFFF">
          <rect x="25.83" y="40" width="180" height="380"/>
          <rect x="605.83" y="40" width="180" height="380"/>
          <circle cx="317.17" cy="128.67" r="88.67"/>
          <rect x="805.83" y="268" width="180" height="152"/>
          <polygon points="1185.83 242.67 1185.83 40 1005.83 40 1005.83 420 1031.55 420 1185.83 420 1365.83 420 1365.83 242.67 1185.83 242.67"/>
          <circle cx="894.5" cy="154" r="88.67"/>
          <circle cx="1474.17" cy="330" r="90" fill="#E0F87D"/>
          <path d="M585.83,420c-99.76,0-180.63-85.07-180.63-190s80.87-190,180.63-190"/>
          <path d="M406.17,420c0-110.46-80.74-200-180.33-200v200h180.33Z"/>
        </g>
      </svg>
      <div class="cw-byline"><span>by</span><span>kana</span><span>raja</span></div>
    </div>

    <div class="cw-vignette"></div>
    <div class="cw-grain" id="cwGrain"></div>
    <div class="cw-bar cw-bar--top" id="cwBarT"></div>
    <div class="cw-bar cw-bar--bottom" id="cwBarB"></div>

    <div class="cw-hint" id="cwHint">Scroll to enter the studio</div>
    <div class="cw-progress"><i id="cwProg"></i></div>
  </div>
</section>
<div class="cw-after">Portfolio continues here</div>

<script>
(() => {
  // ── Media: the original animations, straight from the site's public folder ──
  const HI = '../public/hero-intro/';
  const MEDIA = {
    start: { webm: HI + 'herointrostart.webm', webp: HI + 'herointrostart.webp' },
    chips: [
      { n: 1, tag: 'Colour',       room: 'Atrium · foot of the stair' },
      { n: 2, tag: 'Illustration', room: 'Mezzanine' },
      { n: 4, tag: 'Planning',     room: 'Model workshop' },
      { n: 5, tag: 'Materials',    room: 'Studio floor' },
      { n: 6, tag: 'Making',       room: 'Courtyard' },
      { n: 'start', tag: 'Ideas',  room: 'Library' },
    ].map((c) => ({ ...c, webm: HI + `herointro${c.n}.webm`, webp: HI + `herointro${c.n}.webp` })),
  };
  const probe = document.createElement('video');
  const canWebm = !!probe.canPlayType && probe.canPlayType('video/webm; codecs="vp9"') !== '';
  function img(m) { const i = new Image(); i.src = m.webp; i.alt = ''; return i; }
  function media(m) {
    if (!canWebm) return img(m);
    const v = document.createElement('video');
    v.muted = true; v.loop = true; v.autoplay = true; v.playsInline = true; v.preload = 'auto';
    v.setAttribute('muted', ''); v.setAttribute('playsinline', '');
    v.poster = m.webp; v.src = m.webm;
    v.addEventListener('error', () => v.replaceWith(img(m)));
    return v;
  }
  document.getElementById('cwIntroMedia').appendChild(media(MEDIA.start));

  // ── Palette ──
  const LILAC = [212, 199, 255], COBALT = [51, 92, 255], LIME = [224, 248, 125], WHITE = [255, 255, 255];
  const rgba = (c, a) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;
  const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const ease = (t) => t * t * (3 - 2 * t);
  const easeIO = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
  const range = (p, a, b) => clamp((p - a) / (b - a));

  let seed = 11;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const rr = (a, b) => a + rnd() * (b - a);

  // ════════════════════════════════════════════════════════════════
  //  THE BUILDING — every object is a list of 3D line segments.
  //  Units: metres. y up. Entrance at z = 0, building runs to z = 80.
  // ════════════════════════════════════════════════════════════════
  const objs = [];
  const TIPS = [];
  let O = null;
  // colour roles: 'l' lilac line, 'c' cobalt structure, 'g' lime light, 'w' white detail
  function begin(cx, cy, cz, r) { O = { c: [cx, cy, cz], r, segs: [], dots: [], labels: [], dims: [] }; objs.push(O); }
  function L(a, b, s = 'line', col = 'l') { O.segs.push({ a, b, s, col, t: rnd() * 0.5 }); }
  function poly(pts, s, col, close) { for (let i = 0; i < pts.length - 1; i++) L(pts[i], pts[i + 1], s, col); if (close) L(pts[pts.length - 1], pts[0], s, col); }
  function box(x, y, z, w, h, d, s, col) {
    const p = [[x,y,z],[x+w,y,z],[x+w,y,z+d],[x,y,z+d]], q = p.map(([a,b,c]) => [a, b+h, c]);
    for (let i = 0; i < 4; i++) { L(p[i], p[(i+1)%4], s, col); L(q[i], q[(i+1)%4], s, col); L(p[i], q[i], s, col); }
  }
  function ring(cx, cy, cz, r, plane = 'xz', n = 24, s, col, a0 = 0, a1 = Math.PI * 2) {
    const pts = [];
    for (let i = 0; i <= n; i++) {
      const t = a0 + (i / n) * (a1 - a0);
      pts.push(plane === 'xz' ? [cx + Math.cos(t) * r, cy, cz + Math.sin(t) * r]
             : plane === 'xy' ? [cx + Math.cos(t) * r, cy + Math.sin(t) * r, cz]
             : [cx, cy + Math.sin(t) * r, cz + Math.cos(t) * r]);
    }
    poly(pts, s, col);
  }
  function cyl(cx, y0, y1, cz, r, n = 16, s, col) {
    ring(cx, y0, cz, r, 'xz', n, s, col); ring(cx, y1, cz, r, 'xz', n, s, col);
    for (let i = 0; i < 4; i++) { const a = i * Math.PI / 2; L([cx + Math.cos(a) * r, y0, cz + Math.sin(a) * r], [cx + Math.cos(a) * r, y1, cz + Math.sin(a) * r], s, col); }
  }
  const dot = (p) => O.dots.push(p);
  const label = (p, text) => O.labels.push({ p, text });
  const dim = (a, b, text) => O.dims.push({ a, b, text });

  // ── Entrance facade: glazing grid, deep vertical fins, canopy ──
  begin(0, 4.5, 0, 26);
  L([-24, 0, 0], [24, 0, 0], 'line', 'c'); L([-24, 9, 0], [24, 9, 0], 'line', 'c');
  for (let x = -24; x <= 24.01; x += 1.5) {
    const door = Math.abs(x) < 3;
    if (!door) L([x, 0, 0], [x, 9, 0], 'line', 'l'); else L([x, 4.2, 0], [x, 9, 0], 'line', 'l');
    L([x, 0, -0.8], [x, 9, -0.8], 'line', 'l'); L([x, 9, -0.8], [x, 9, 0], 'line', 'l'); L([x, 0, -0.8], [x, 0, 0], 'dot', 'l');  // fins
  }
  [3, 6].forEach((y) => { L([-24, y, 0], [-3, y, 0], 'dash', 'l'); L([3, y, 0], [24, y, 0], 'dash', 'l'); });
  box(-4, 4.2, -2.4, 8, 0.25, 2.4, 'line', 'c');                     // canopy
  for (let x = -3.5; x <= 3.51; x += 0.5) L([x, 4.2, -2.4], [x, 4.2, 0], 'dot', 'l');
  [-3, 3].forEach((x) => L([x, 0, 0], [x, 4.2, 0], 'line', 'c'));
  for (let i = 0; i < 4; i++) L([-3 + i * 1.5 + 0.75, 0, 0.02], [-3 + i * 1.5 + 0.75, 3.8, 0.02], 'dash', 'w');   // doors
  dim([-24, -0.4, -1.2], [24, -0.4, -1.2], '48.00');

  // ── Shell: outer walls, roof edge, column grid ──
  begin(0, 4.5, 40, 50);
  [[-24, 0, 0, 80], [24, 0, 0, 80]].forEach(([x]) => { L([x, 0, 0], [x, 0, 80], 'line', 'c'); L([x, 9, 0], [x, 9, 80], 'dash', 'l'); });
  L([-24, 0, 80], [24, 0, 80], 'line', 'c'); L([-24, 9, 80], [24, 9, 80], 'dash', 'l');
  for (let z = 8; z <= 72; z += 8) L([-24, 9, z], [24, 9, z], 'dot', 'l');               // roof beams
  for (let z = 8; z <= 72; z += 8) for (const x of [-16, 16]) {
    if (z > 46 && z < 62) continue;
    begin(x, 4.5, z, 5); cyl(x, 0, 9, z, 0.3, 14, 'line', 'l');
    ring(x, 0.02, z, 0.6, 'xz', 16, 'dot', 'l');
  }

  // ── Reception: curved desk + logo wall ──
  begin(-6, 1, 5, 4);
  ring(-6, 1.1, 6, 2.2, 'xz', 30, 'line', 'l', Math.PI * 0.15, Math.PI * 0.95);
  ring(-6, 0.0, 6, 2.2, 'xz', 30, 'line', 'l', Math.PI * 0.15, Math.PI * 0.95);
  ring(-6, 1.1, 6, 1.7, 'xz', 30, 'dash', 'l', Math.PI * 0.15, Math.PI * 0.95);
  for (let i = 0; i <= 8; i++) { const a = Math.PI * (0.15 + i * 0.1); L([-6 + Math.cos(a) * 2.2, 0, 6 + Math.sin(a) * 2.2], [-6 + Math.cos(a) * 2.2, 1.1, 6 + Math.sin(a) * 2.2], i % 2 ? 'dot' : 'line', 'l'); }
  ring(-6, 1.12, 6, 0.08, 'xz', 10, 'line', 'g'); dot([-6.4, 1.15, 7.6]);
  label([-6, 0.01, 3], 'RECEPTION');
  // plinths with small models in the lobby
  for (let i = 0; i < 3; i++) {
    const x = 5 + i * 1.8, z = 4.5;
    begin(x, 0.6, z, 1.2); box(x - 0.35, 0, z - 0.35, 0.7, 1.0, 0.7, 'line', 'l');
    for (let k = 0; k < 5; k++) { const h = rr(0.1, 0.45); box(x - 0.3 + (k % 3) * 0.2, 1.0, z - 0.25 + Math.floor(k / 3) * 0.25, 0.15, h, 0.18, k % 2 ? 'dash' : 'line', 'w'); }
  }

  // ── Atrium: double height, diagrid skylight, pendant cluster ──
  begin(0, 9, 20, 14);
  poly([[-8, 9, 8], [8, 9, 8], [8, 9, 32], [-8, 9, 32]], 'line', 'c', true);
  for (let k = -24; k <= 24; k += 2) {                                 // diagrid
    const a = [], b = [];
    for (let s = 0; s <= 1; s += 1) {}
    const p1 = [Math.max(-8, -8 + k), Math.max(8, 8 - k)], p2 = [Math.min(8, 8 + k), Math.min(32, 32 + k)];
    const seg1 = clipDiag(-8 + k, 8, 1), seg2 = clipDiag(8 - k, 8, -1);
    if (seg1) L([seg1[0], 9, seg1[1]], [seg1[2], 9, seg1[3]], 'line', 'l');
    if (seg2) L([seg2[0], 9, seg2[1]], [seg2[2], 9, seg2[3]], 'dash', 'l');
  }
  function clipDiag(x0, z0, dir) {                                    // line x = x0 + dir*(z - z0) inside the skylight
    const pts = [];
    for (let z = 8; z <= 32; z += 0.25) { const x = x0 + dir * (z - z0); if (x >= -8 && x <= 8) pts.push([x, z]); }
    return pts.length > 1 ? [pts[0][0], pts[0][1], pts[pts.length - 1][0], pts[pts.length - 1][1]] : null;
  }
  for (let z = 8; z <= 32; z += 4) L([-8, 9.6, z], [8, 9.6, z], 'dot', 'l');   // raised roof lantern
  [[-8, 8], [8, 8], [8, 32], [-8, 32]].forEach(([x, z]) => L([x, 9, z], [x, 9.6, z], 'line', 'l'));
  poly([[-8, 9.6, 8], [8, 9.6, 8], [8, 9.6, 32], [-8, 9.6, 32]], 'line', 'l', true);
  // pendant cluster
  begin(-1, 6, 18, 5);
  for (let i = 0; i < 11; i++) {
    const x = rr(-3, 1.5), z = rr(15, 21), y = rr(5.2, 7.4), r = rr(0.18, 0.34);
    L([x, 9, z], [x, y + r, z], 'dot', 'l');
    ring(x, y, z, r, 'xy', 18, 'line', 'l'); ring(x, y, z, r, 'yz', 18, 'dash', 'l'); ring(x, y, z, r * 0.4, 'xz', 10, 'line', 'g');
    dot([x, y, z]);
  }
  label([0, 0.01, 12], 'ATRIUM');
  dim([8.6, 0, 12], [8.6, 9, 12], '9.00');

  // ── Spiral stair to the mezzanine ──
  begin(5, 2.1, 20, 3.4);
  const SC = [5, 20], R1 = 0.35, R2 = 1.7, TURN = 1.15 * Math.PI * 2, STEPS = 26, A0 = Math.PI * 0.6;
  for (let i = 0; i <= STEPS; i++) {
    const a = A0 + (i / STEPS) * TURN, y = (i / STEPS) * 4.2;
    const ci = [SC[0] + Math.cos(a) * R1, y, SC[1] + Math.sin(a) * R1], co = [SC[0] + Math.cos(a) * R2, y, SC[1] + Math.sin(a) * R2];
    L(ci, co, 'line', 'l');
    if (i < STEPS) {
      const a2 = A0 + ((i + 1) / STEPS) * TURN, y2 = ((i + 1) / STEPS) * 4.2;
      L(co, [SC[0] + Math.cos(a2) * R2, y, SC[1] + Math.sin(a2) * R2], 'line', 'l');                       // tread edge
      L([SC[0] + Math.cos(a2) * R2, y, SC[1] + Math.sin(a2) * R2], [SC[0] + Math.cos(a2) * R2, y2, SC[1] + Math.sin(a2) * R2], 'dot', 'l');  // riser
      L([SC[0] + Math.cos(a) * R2, y + 0.95, SC[1] + Math.sin(a) * R2], [SC[0] + Math.cos(a2) * R2, y2 + 0.95, SC[1] + Math.sin(a2) * R2], 'line', 'w');   // handrail
      if (i % 2 === 0) L(co, [co[0], y + 0.95, co[2]], 'line', 'l');                                      // balusters
    }
  }
  cyl(SC[0], 0, 5.2, SC[1], R1, 12, 'line', 'c');
  ring(SC[0], 0.01, SC[1], R2 + 0.3, 'xz', 32, 'dot', 'l');

  // ── Mezzanine: slab, glass balustrade, workstations ──
  begin(0, 4.2, 28.5, 9);
  poly([[-8, 4.2, 25], [8, 4.2, 25], [8, 4.2, 32], [-8, 4.2, 32]], 'line', 'c', true);
  poly([[-8, 3.9, 25], [8, 3.9, 25]], 'line', 'c');
  for (let x = -8; x <= 8.01; x += 1) {
    L([x, 4.2, 25], [x, 5.25, 25], 'line', 'l');
    if (x < 8) poly([[x + 0.05, 4.3, 25], [x + 0.95, 4.3, 25], [x + 0.95, 5.15, 25], [x + 0.05, 5.15, 25]], 'dot', 'l', true);
  }
  L([-8, 5.25, 25], [8, 5.25, 25], 'line', 'w');
  for (let x = -6; x <= 6; x += 3) {
    box(x - 0.9, 4.2 + 0.72, 28.6, 1.8, 0.04, 0.8, 'line', 'l');
    rectX(x - 0.5, 4.2 + 0.98, 4.2 + 1.42, 29.2, 29.25);
    L([x - 0.6, 4.2, 28.7], [x - 0.6, 4.92, 28.7], 'dot', 'l'); L([x + 0.6, 4.2, 28.7], [x + 0.6, 4.92, 28.7], 'dot', 'l');
  }
  function rectX(x0, y0, y1, z0, z1) { poly([[x0, y0, z0], [x0 + 1, y0, z0], [x0 + 1, y1, z0], [x0, y1, z0]], 'line', 'l', true); }
  label([0, 4.21, 30.8], 'MEZZANINE');

  // ── Model workshop (left): city model, cutting tables, material wall, laser cutter ──

    const up = clamp((c.pos[1] - 8) / 40); ALT = 1.15 + up * 1.2; LWB = 1 + up * 1.4;

    const worldA = range(p, 0.05, 0.13) * (1 - range(p, 0.955, 0.985) * 0.85);
    const buildBoost = range(p, 0.86, 0.94) * 1.5;      // everything completes as we rise for the aerial view

    ctx.clearRect(0, 0, W, H);
    if (worldA > 0.002) {
      drawDiscs(worldA);
      drawAtmosphere(worldA, tm);
      drawBlocks(worldA);
      drawFloor(worldA);
      drawObjects(worldA, buildBoost);
      drawStipple(worldA);
      drawPeople(worldA, tm);
      drawNotes(worldA * (1 - range(p, 0.86, 0.9)));
    }

    // opening orb grows past the viewer and dissolves into the building
    const io = ease(range(p, 0.03, 0.12));
    intro.style.opacity = 1 - io;
    intro.style.transform = `translate(-50%, -50%) scale(${1 + io * 3})`;
    intro.style.visibility = io >= 1 ? 'hidden' : 'visible';
    const iv = intro.querySelector('video');
    if (iv) { if (io >= 1 && !iv.paused) iv.pause(); else if (io < 1 && iv.paused) iv.play().catch(() => {}); }
    hint.style.opacity = 0.8 * (1 - range(p, 0, 0.03));

    // letterbox bars during the walk
    const bars = range(p, 0.08, 0.14) * (1 - range(p, 0.92, 0.97));
    barT.style.transform = barB.style.transform = `scaleY(${bars})`;

    // characters: rise in as the camera arrives, then stay in the building
    const gather = ease(range(p, 0.955, 0.99));
    const ringR = Math.min(W, H) * 0.32, cPx = Math.min(W, H) * 0.22;
    let active = -1, activeK = 0;
    chips.forEach((ch, i) => {
      const arrive = range(p, ch.key - 0.06, ch.key - 0.012);      // 0 → 1 as we walk up
      const k = ease(arrive);
      if (k > activeK && p < ch.key + 0.04) { active = i; activeK = k * (1 - range(p, ch.key + 0.02, ch.key + 0.04)); }
      const v = view([ch.pos[0], ch.pos[1] + 0.95, ch.pos[2]]);
      let x = -9999, y = -9999, s = 0, o = 0;
      if (v[2] > NEAR) {
        const [sx, sy] = scr(v);
        const px = (1.95 * cam.F) / v[2] * lerp(0.55, 1, k);
        s = px / 600; x = sx - px / 2; y = sy - px / 2 + (1 - k) * px * 0.25;
        o = k * clamp((v[2] - 0.6) / 1.2) * (1 - range(p, 0.9, 0.93));
      }
      // finale: gather round the logo
      const a = -Math.PI / 2 + (i / chips.length) * Math.PI * 2;
      const gx = W / 2 + Math.cos(a) * ringR - cPx / 2, gy = H / 2 + Math.sin(a) * ringR - cPx / 2;
      if (gather > 0.001) {
        const sx0 = W / 2 + Math.cos(a) * ringR * 2.6 - cPx / 2, sy0 = H / 2 + Math.sin(a) * ringR * 2.6 - cPx / 2;
        x = lerp(sx0, gx, gather); y = lerp(sy0, gy, gather); s = (cPx / 600) * lerp(0.7, 1, gather); o = gather;
      } else if (v[2] > NEAR) {
        drawHalo(ch, k * (1 - range(p, 0.9, 0.93)));
      }
      ch.el.style.opacity = o.toFixed(3);
      // only decode the clips you can actually see
      if (ch.vid) {
        const want = o > 0.01;
        if (want && !ch.playing) { ch.vid.play().catch(() => {}); ch.playing = true; }
        else if (!want && ch.playing) { ch.vid.pause(); ch.playing = false; }
      }
      ch.el.style.transform = `translate3d(${x}px, ${y}px, 0) scale(${s})`;
      ch.el.style.zIndex = gather > 0.001 ? 20 : Math.round(1000 - v[2] * 10);
    });

    endEl.style.opacity = ease(range(p, 0.965, 0.995));
    endEl.style.transform = `translate(-50%, -50%) scale(${lerp(0.94, 1, ease(range(p, 0.965, 0.995)))})`;
    prog.style.height = `${(p * 100).toFixed(2)}%`;

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
